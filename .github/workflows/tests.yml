name: Tests

# Runs the full suite on every push and pull request.
#
# This workflow only TESTS. It deliberately does not deploy: reaching the
# instance would require opening SSH to GitHub's runner ranges, which changes
# the security posture of the deployment. See terraform/README.md for the
# deploy path.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The suite uses Starlette's TestClient, which speaks http://. With
      # REQUIRE_HTTPS=true the auth cookie is marked Secure and the client will
      # not send it back, so every authenticated request looks logged out and
      # ~20 tests fail for reasons unrelated to the code under test.
      # tests/_env.py also enforces this, so the suite cannot silently depend on
      # ambient configuration; setting it here as well keeps the intent visible.
      REQUIRE_HTTPS: "false"
      GOOGLE_DEV_MODE: "true"
      # A throwaway file, never the project's own database.
      DATABASE_URL: "sqlite:////tmp/ci-marketplace.db"
      # The app prints startup banners; they only add noise here.
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        run: |
          python -V
          python -c "import fastapi, sqlalchemy; print('fastapi', fastapi.__version__); print('sqlalchemy', sqlalchemy.__version__)"

      # Reads the templates and static/js to confirm every getElementById has a
      # matching element id. Needs no server and catches a whole class of breakage.
      - name: UI wiring (static check)
        run: python tests/test_ui_wiring.py

      - name: Test suite
        run: |
          # One file per process, deliberately — NOT `discover`.
          #
          # `python -m unittest discover` collects tests/test_teams.py (not a
          # unittest module; it drives a live server and has no unittest import)
          # and tests/test_ui_wiring.py (a bare script). Loading those alongside
          # the real suites in a single process makes unrelated tests fail, and
          # the failures move around with collection order.
          #
          # Running each file in its own process also isolates the shared
          # SQLite database between suites. tests/test_teams.py is excluded
          # because it needs a running server; it is listed in README.md as an
          # end-to-end check to run by hand.
          SUITES="
            tests/test_api_client.py
            tests/test_email_verification.py
            tests/test_google_callback.py
            tests/test_mailer_smtp.py
            tests/test_multitenancy.py
            tests/test_rate_limiting.py
            tests/test_security_audit.py
            tests/test_storage.py
            tests/test_transport_security.py
          "

          set +e
          : > /tmp/tests.log
          FAILED=""
          TOTAL=0
          for f in $SUITES; do
            echo "===== $f =====" | tee -a /tmp/tests.log
            python -m unittest "$f" >> /tmp/tests.log 2>&1
            STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "  PASS" | tee -a /tmp/tests.log
            else
              echo "  FAIL (exit $STATUS)" | tee -a /tmp/tests.log
              FAILED="$FAILED $f"
            fi
            TOTAL=$((TOTAL + 1))
          done
          set -e

          echo
          echo "=============== summary ==============="
          grep -E "^(Ran |OK|FAILED|=====)" /tmp/tests.log || true

          if [ -n "$FAILED" ]; then
            echo
            # Print the tracebacks. unittest writes them BEFORE its summary, so
            # a version of this workflow that showed only the tail hid the cause
            # of the failure entirely.
            echo "=============== failure detail ==============="
            grep -nE "^(FAIL|ERROR):" /tmp/tests.log | head -40 || true
            echo
            echo "--- relevant tracebacks ---"
            grep -nE "^(FAIL|ERROR|Traceback|AssertionError|[A-Za-z]+Error:)" /tmp/tests.log | head -60 || true
            echo
            echo "--- last 150 lines for context ---"
            tail -150 /tmp/tests.log
            echo "::error::Failing suites:$FAILED"
            exit 1
          fi

          echo
          echo "All $TOTAL suites passed."
